services:
  - type: web
    name: bsc-management-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Prisma uses this direct connection for `prisma db push` during builds.
      # Runtime queries continue to use DATABASE_URL through the pooler.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: INITIAL_CEO_EMAIL
        value: samsonyeshanew@gmail.com
      - key: INITIAL_CEO_PASSWORD
        sync: false
      - key: RESET_INITIAL_CEO_PASSWORD
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: BSC System <onboarding@resend.dev>
      - key: AFROMESSAGE_TOKEN
        sync: false
      - key: AFROMESSAGE_IDENTIFIER
        sync: false
      - key: AFROMESSAGE_SENDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
